<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notícia — Oeiras Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/IDENTIDADE/logos/favicon.png">
  <meta name="theme-color" content="#001531">
  <meta property="og:site_name" content="Oeiras Online">
  <meta property="og:image" content="https://www.oeirasonline.com.br/assets/IDENTIDADE/logos/og-oeiras-online.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="noticia">
  <main class="wrap article">
    <article class="inner">
      <div class="crumbs" id="crumbs"></div>
      <span id="chip"></span>
      <h1 id="t"><span class="loading"><span class="spinner"></span>Carregando notícia…</span></h1>
      <p class="sub" id="sub"></p>

      <div class="byline">
        <div class="av"><img src="assets/IDENTIDADE/logos/simbolo-on-branco.png" alt=""></div>
        <div><b id="autor"></b><span id="quando"></span></div>
        <div class="share">
          <button class="icon-btn" data-share aria-label="Compartilhar"><i data-lucide="share-2"></i></button>
          <a class="icon-btn" id="share-wa" href="https://wa.me/" target="_blank" rel="noopener" aria-label="Compartilhar no WhatsApp"><i data-lucide="message-circle"></i></a>
          <a class="icon-btn" id="share-fb" href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Compartilhar no Facebook"><i data-lucide="facebook"></i></a>
        </div>
      </div>

      <figure class="article-img" id="capa" hidden><img id="hero-img" alt=""><figcaption id="legenda"></figcaption></figure>

      <div class="prose" id="corpo"></div>

      <div class="ad" style="min-height:120px;margin:24px 0"><div class="deco"></div><div><h3 style="font-size:20px">Espaço publicitário</h3><p>Banner 728×90</p></div></div>
    </article>

    <section class="block" id="related-block">
      <div class="sec-head"><h2><i data-lucide="newspaper"></i> Leia também</h2><a class="more" href="noticias.html">Ver todas <i data-lucide="arrow-right"></i></a></div>
      <div class="cards cards-grid" id="related"></div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
